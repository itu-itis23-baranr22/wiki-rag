[tool.ruff]
line-length = 130
target-version = "py310"
exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "UP006", # the codebase uses typing.List and friends throughout
    "UP035",
    "UP045",
    "UP007",
    "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
